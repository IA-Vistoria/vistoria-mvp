---
- name: Instala dependências para o repositório apt do Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Cria diretório de keyrings do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixa a chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adiciona o repositório apt do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    filename: docker

# Instala o plugin `docker compose` (docker-compose-plugin), não o binário
# standalone antigo `docker-compose`, que está descontinuado.
- name: Instala Docker Engine e o plugin docker compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Garante que o serviço docker está habilitado e ativo
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Adiciona o usuário de deploy ao grupo docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
