spring.application.name=vistoria-predial

# ─── Datasource ───────────────────────────────────────────────────────────────
# Em produção, sobrescreva com variáveis de ambiente (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:vistoriapredial;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true

# ─── Multipart (upload de fotos) ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Storage local ────────────────────────────────────────────────────────────
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Cadastro profissional ───────────────────────────────────────────────────
app.engineer-registration-code=${ENGINEER_REGISTRATION_CODE:}

# ─── OCI Generative AI ────────────────────────────────────────────────────────
oci.genai.endpoint=${OCI_GENAI_ENDPOINT:https://inference.generativeai.us-chicago-1.oci.oraclecloud.com}
oci.genai.model-id=${OCI_GENAI_MODEL_ID:ocid1.generativeaimodel.oc1.us-chicago-1.amaaaaaask7dceya37mfr4n2heajm3jq4zzqn7k3xtmidnrsbhqbebwlhv2q}
oci.genai.compartment-id=${OCI_GENAI_COMPARTMENT_ID:ocid1.compartment.oc1..placeholder}
oci.genai.connect-timeout-ms=${OCI_GENAI_CONNECT_TIMEOUT_MS:5000}
oci.genai.read-timeout-ms=${OCI_GENAI_READ_TIMEOUT_MS:30000}
