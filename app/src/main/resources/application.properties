spring.application.name=vistoria-predial

# ─── Datasource ───────────────────────────────────────────────────────────────
# Em produção, sobrescreva com variáveis de ambiente (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:vistoriapredial;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true

# ─── Multipart (upload de fotos) ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Storage local ────────────────────────────────────────────────────────────
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Cadastro profissional ───────────────────────────────────────────────────
app.engineer-registration-code=${ENGINEER_REGISTRATION_CODE:}

# ─── Integração VLM (inference) ───────────────────────────────────────────────
# mock = pré-laudo local; vlm = POST {VLM_URL}/analyze
app.ia.provider=${APP_IA_PROVIDER:mock}
vlm.url=${VLM_URL:http://127.0.0.1:8001}
vlm.api-key=${VLM_API_KEY:}
vlm.connect-timeout-ms=${VLM_CONNECT_TIMEOUT_MS:5000}
vlm.read-timeout-ms=${VLM_READ_TIMEOUT_MS:300000}

# ─── OCI Generative AI ────────────────────────────────────────────────────────
oci.genai.auth-mode=${OCI_AUTH_MODE:config_file}
oci.genai.region=${OCI_REGION:sa-saopaulo-1}
oci.genai.compartment-id=${OCI_COMPARTMENT_ID:}
oci.genai.model-id=${OCI_GENAI_MODEL_ID:google.gemini-2.5-flash}
oci.genai.config-file=${OCI_CONFIG_FILE:${user.home}/.oci/config}
oci.genai.config-profile=${OCI_CONFIG_PROFILE:DEFAULT}
oci.genai.connect-timeout-ms=${OCI_GENAI_CONNECT_TIMEOUT_MS:5000}
oci.genai.read-timeout-ms=${OCI_GENAI_READ_TIMEOUT_MS:30000}
oci.genai.max-attempts=${OCI_GENAI_MAX_ATTEMPTS:3}
oci.genai.retry-delay-ms=${OCI_GENAI_RETRY_DELAY_MS:500}
