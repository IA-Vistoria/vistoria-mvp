spring.application.name=vistoria-predial
spring.datasource.url=jdbc:h2:mem:vistoriapredial;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.cors.allowed-origins=http://localhost:3000
app.engineer-registration-code=convite-exclusivo-para-testes
storage.upload-dir=target/test-uploads
jwt.secret=segredo-exclusivo-para-testes-com-mais-de-32-bytes
jwt.expiration-ms=86400000
