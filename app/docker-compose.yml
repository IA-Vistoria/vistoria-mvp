services:
  inference:
    profiles: ["vlm"]
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: vistoria-predial-inference:local
    ports:
      - "${PORT:-8001}:8001"
    environment:
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-15}
      PORT: "8001"
      LOAD_IN_4BIT: ${LOAD_IN_4BIT:-false}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-1024}
      API_KEY: ${VLM_API_KEY}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - hf_cache:/models/hf_cache
    # Requer NVIDIA Container Toolkit. Sem GPU: MODEL_DEVICE=cpu e remova a linha gpus.
    gpus: all
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vistoria-predial-backend:local
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ENGINEER_REGISTRATION_CODE: ${ENGINEER_REGISTRATION_CODE}
      APP_IA_PROVIDER: ${APP_IA_PROVIDER:-oci}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-config_file}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_COMPARTMENT_ID: ${OCI_COMPARTMENT_ID}
      OCI_GENAI_MODEL_ID: ${OCI_GENAI_MODEL_ID:-google.gemini-2.5-flash}
      OCI_CONFIG_FILE: ${OCI_CONFIG_FILE:-/home/spring/.oci/config}
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-DEFAULT}
      OCI_GENAI_CONNECT_TIMEOUT_MS: ${OCI_GENAI_CONNECT_TIMEOUT_MS:-5000}
      OCI_GENAI_READ_TIMEOUT_MS: ${OCI_GENAI_READ_TIMEOUT_MS:-30000}
      OCI_GENAI_MAX_ATTEMPTS: ${OCI_GENAI_MAX_ATTEMPTS:-3}
      OCI_GENAI_RETRY_DELAY_MS: ${OCI_GENAI_RETRY_DELAY_MS:-500}
      VLM_URL: ${VLM_URL:-http://inference:8001}
      VLM_API_KEY: ${VLM_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    image: vistoria-predial-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  hf_cache:
